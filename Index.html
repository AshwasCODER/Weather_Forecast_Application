<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue-100 min-h-screen font-sans">

  <div class="max-w-xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center text-blue-800 mb-4">Weather Forecast</h1>

    <div class="flex flex-col sm:flex-row gap-2 mb-4">
      <input id="cityInput" type="text" placeholder="Enter city name" class="p-2 border rounded w-full">
      <button id="searchBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Search</button>
      <button id="currentBtn" class="bg-gray-600 text-white px-4 py-2 rounded">📍</button>
    </div>

    <div id="recentDropdown" class="mb-4 hidden">
      <label class="text-sm text-gray-700">Recent Searches:</label>
      <select id="recentSelect" class="w-full p-2 border rounded">
        <!-- Options will be added dynamically -->
      </select>
    </div>

    <div id="weatherResult" class="bg-white rounded-lg shadow p-4 hidden">
      <h2 id="location" class="text-2xl font-bold mb-2"></h2>
      <p id="condition" class="text-lg"></p>
      <div class="flex justify-between mt-2">
        <p>🌡️ <span id="temperature"></span>°C</p>
        <p>💨 <span id="wind"></span> km/h</p>
        <p>💧 <span id="humidity"></span>%</p>
      </div>
    </div>

    <div id="forecast" class="mt-6 hidden">
      <h3 class="text-xl font-semibold mb-2">5-Day Forecast</h3>
      <div id="forecastCards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Cards will be added dynamically -->
      </div>
    </div>

    <p id="error" class="text-red-600 text-center mt-4 hidden"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
