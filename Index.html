<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen font-sans">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-900 flex items-center justify-center gap-2">
        🌦️ Weather Forecast
      </h1>
      <p class="text-sm text-blue-700">Live updates for any city worldwide</p>
    </div>

    <!-- Input Section -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center items-center mb-6">
      <input
        id="cityInput"
        type="text"
        placeholder="Enter city name"
        class="w-full sm:w-2/3 px-4 py-2 border border-blue-400 rounded shadow focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div class="flex gap-2 w-full sm:w-auto justify-center">
        <button
          id="searchBtn"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow w-full sm:w-auto"
        >
          Search
        </button>
        <button
          id="currentBtn"
          class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow w-full sm:w-auto"
        >
          Use My Location
        </button>
      </div>
    </div>

    <!-- Error Message -->
    <div id="error" class="text-red-600 text-center font-medium hidden mb-4"></div>

    <!-- Recent Dropdown -->
    <div id="recentDropdown" class="text-center mb-4 hidden">
      <label for="recentSelect" class="font-medium mr-2">Recent Cities:</label>
      <select id="recentSelect" class="border border-blue-400 rounded px-3 py-1">
        <!-- Options will be loaded dynamically -->
      </select>
    </div>

    <!-- Current Weather Display -->
    <div id="weatherResult" class="bg-white rounded-lg shadow p-6 text-center hidden">
      <h2 class="text-xl font-semibold mb-2" id="location"></h2>
      <p class="text-4xl font-bold text-blue-700 mb-2">
        <span id="temperature">--</span>°C
      </p>
      <p class="text-sm text-gray-700 mb-1" id="condition"></p>
      <div class="flex justify-center gap-4 text-sm text-gray-600 mt-3">
        <span>💧 Humidity: <span id="humidity">--</span>%</span>
        <span>💨 Wind: <span id="wind">--</span> km/h</span>
      </div>
    </div>

    <!-- Forecast Section -->
    <div id="forecast" class="mt-8 hidden">
      <h3 class="text-lg font-semibold text-center text-blue-900 mb-4">5-Day Forecast</h3>
      <div id="forecastCards" class="flex flex-wrap gap-4 justify-center">
        <!-- Forecast cards will be added here -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
