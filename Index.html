<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-r from-blue-100 via-blue-200 to-blue-300 text-gray-800">

    <!-- Main container -->
    <div class="max-w-6xl mx-auto p-4">

        <!-- Header section -->
        <header class="text-center my-8">
            <h1 class="text-4xl font-bold text-blue-900">Weather Forecast</h1>
            <p class="text-lg text-blue-800 mt-2">Your reliable weather forecast application</p>
        </header>

        <!-- Weather input and search section -->
        <div class="flex flex-col items-center md:flex-row justify-between bg-white p-4 rounded shadow-md">
            <input type="text" id="cityInput" class="w-full md:w-1/3 p-2 rounded border border-blue-400" placeholder="Enter city name" />
            <button id="searchBtn" class="w-full md:w-1/4 mt-2 md:mt-0 p-2 bg-blue-600 text-white rounded hover:bg-blue-500">Search</button>
            <button id="currentBtn" class="w-full md:w-1/4 mt-2 md:mt-0 p-2 bg-blue-600 text-white rounded hover:bg-blue-500">Use My Location</button>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="hidden text-center text-red-500 mt-4"></div>

        <!-- Current Weather Section -->
        <div id="weatherResult" class="hidden mt-8 bg-white p-6 rounded shadow-md text-center">
            <h2 id="location" class="text-2xl font-semibold"></h2>
            <p id="condition" class="mt-4 text-lg"></p>
            <p id="temperature" class="text-5xl font-bold mt-2"></p>
            <p class="mt-2">Humidity: <span id="humidity"></span>% | Wind: <span id="wind"></span> km/h</p>
        </div>

        <!-- Forecast Section -->
        <div id="forecast" class="hidden mt-8">
            <h2 class="text-2xl font-semibold text-center">5-Day Forecast</h2>
            <div id="forecastCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 mt-4"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
